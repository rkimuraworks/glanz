<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Logo Scroll Animation (Refined)</title>
  
  <!-- Google Fonts (Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: sans-serif;
      color: #333;
      overflow-x: hidden;
    }

    /* 固定ヘッダー */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #eee;
    }

    /* ヘッダー左上のターゲット枠 */
    .header-logo-target {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ヘッダー中央のターゲット（GLANZ文字用） */
    .header-title-target {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: #333;
      opacity: 0; /* 最初は非表示 */
      white-space: nowrap;
    }

    .nav-list {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-weight: bold;
      font-size: 14px;
    }

    /* 画面固定スクロールエリア */
    .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 中央のGLANZテキスト */
    .hero-glanz-text {
      position: absolute;
      top: calc(50% + 130px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.15em;
      color: #333;
      margin: 0;
      white-space: nowrap;
    }

    /* アニメーションSVG（初期状態は画面中央） */
    .animated-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      overflow: visible;
      z-index: 2000;
      pointer-events: none;
    }

    .mark-grey { fill: #9DA5A9; }
    .mark-orange { fill: #FF5500; }

    /* 下部コンテンツ */
    .content-section {
      min-height: 150vh;
      background: #ffffff;
      padding: 100px 24px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .animated-logo {
        width: 160px;
        height: 160px;
      }
      .hero-glanz-text {
        top: calc(50% + 110px);
        font-size: 22px;
      }
      .header-logo-target {
        width: 32px;
        height: 32px;
      }
      .nav-list {
        gap: 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="site-header">
    <div class="header-logo-target" id="logoTarget"></div>
    <div class="header-title-target" id="headerTitleTarget">GLANZ</div>
    <ul class="nav-list">
      <li>ABOUT</li>
      <li>PRODUCTS</li>
      <li>CONTACT</li>
    </ul>
  </header>

  <!-- 画面固定スクロールエリア -->
  <section class="hero-section" id="hero">
    <h1 class="hero-glanz-text" id="heroGlanzText">GLANZ</h1>
  </section>

  <!-- スクロール演出用のロゴ -->
  <svg viewBox="0 0 200 200" class="animated-logo" id="animatedLogo">
    <!-- 丸（グレー） -->
    <path class="mark-grey" id="circlePart" d="M100,152.4c-28.9,0-52.4-23.4-52.4-52.4S71.1,47.6,100,47.6c25.5,0,46.7,18.2,51.4,42.3h48.1 C194.4,39.4,151.8,0,100,0C44.8,0,0,44.8,0,100s44.8,100,100,100c25.3,0,48.3-9.4,65.9-24.8l-33.8-33.8 C123.2,148.2,112.1,152.4,100,152.4"/>
    <!-- 三角（オレンジ） -->
    <polygon class="mark-orange" id="trianglePart" points="200,105.3 200,187.3 118,105.3"/>
  </svg>

  <!-- メインコンテンツ -->
  <section class="content-section">
    <h2>Main Content Area</h2>
    <p>スクロールを下に下げ切ってもロゴとテキストの位置がズレずに固定されます。</p>
  </section>

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const logo = document.getElementById('animatedLogo');
    const target = document.getElementById('logoTarget');

    // ゴール地点（ヘッダーターゲット）への変形量を計算
    function getTargetOffset() {
      const targetRect = target.getBoundingClientRect();
      const logoRect = logo.getBoundingClientRect();

      return {
        x: targetRect.left - logoRect.left,
        y: targetRect.top - logoRect.top,
        scale: targetRect.width / logoRect.width
      };
    }

    ScrollTrigger.matchMedia({

      // ----------------------------------------
      // 1. PC用の設定（769px以上）
      // ----------------------------------------
      "(min-width: 769px)": function() {
        gsap.set('#circlePart', { x: -180, y: -120, rotation: -90, opacity: 0, transformOrigin: 'center center' });
        gsap.set('#trianglePart', { x: 180, y: 120, rotation: 90, opacity: 0, transformOrigin: 'center center' });
        gsap.set(logo, { transformOrigin: 'top left' });

        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: '#hero',
            start: 'top top',
            end: '+=1400',
            scrub: 1,
            pin: true,
            invalidateOnRefresh: true
          }
        });

        // STEP 1: ロゴパーツ合体 & 中央GLANZ文字のフェードアウト
        tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1.5, ease: 'power2.out' })
          .to('#heroGlanzText', { opacity: 0, duration: 0.8 }, '<');

        // STEP 2: ロゴがヘッダー左上へ移動 & ヘッダー中央へGLANZ文字がフェードイン
        tl.to(logo, {
          x: () => getTargetOffset().x,
          y: () => getTargetOffset().y,
          scale: () => getTargetOffset().scale,
          duration: 1.5,
          ease: 'power2.inOut'
        })
        .to('#headerTitleTarget', { opacity: 1, duration: 1 }, '-=0.8');
      },

      // ----------------------------------------
      // 2. スマホ用の設定（768px以下）
      // ----------------------------------------
      "(max-width: 768px)": function() {
        gsap.set('#circlePart', { x: -80, y: -50, rotation: -45, opacity: 0, transformOrigin: 'center center' });
        gsap.set('#trianglePart', { x: 80, y: 50, rotation: 45, opacity: 0, transformOrigin: 'center center' });
        gsap.set(logo, { transformOrigin: 'top left' });
        gsap.set('#headerTitleTarget', { opacity: 0 }); // スマホではメニュー中央文字は非表示

        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: '#hero',
            start: 'top top',
            end: '+=900', // スクロール量をコンパクトに設定
            scrub: 0.5,
            pin: true,
            invalidateOnRefresh: true
          }
        });

        // STEP 1: 合体 & 文字消去
        tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1, ease: 'power2.out' })
          .to('#heroGlanzText', { opacity: 0, duration: 0.5 }, '<');

        // STEP 2: ヘッダーへ納める（文字フェードインは無し）
        tl.to(logo, {
          x: () => getTargetOffset().x,
          y: () => getTargetOffset().y,
          scale: () => getTargetOffset().scale,
          duration: 1,
          ease: 'power2.inOut'
        });
      }

    });

    // 画面サイズ変更時やスマホの縦横変更時に計算位置を自動更新
    window.addEventListener('resize', () => ScrollTrigger.refresh());
  </script>
</body>
</html>
