<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Logo Scroll Animation (Fixed)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: sans-serif;
      color: #333;
    }

    /* 固定ヘッダー */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      box-sizing: border-box;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #eee;
    }

    /* ヘッダーの受け皿枠 */
    .header-logo-target {
      width: 40px;
      height: 40px;
    }

    .nav-list {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-weight: bold;
      font-size: 14px;
    }

    /* 1. 画面全体で固定するヒーローセクション */
    .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 画面全体を覆う fixed ロゴ（最前面に配置） */
    .animated-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      margin-top: -100px; /* 中央寄せ */
      margin-left: -100px;
      overflow: visible;
      z-index: 2000; /* ヘッダーより上に表示 */
      pointer-events: none;
    }

    .mark-grey { fill: #9DA5A9; }
    .mark-orange { fill: #FF5500; }

    .hero-text {
      margin-top: 260px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }

    /* 2. アニメーション完了後に現れる下部コンテンツ */
    .content-section {
      min-height: 150vh;
      background: #ffffff;
      padding: 100px 40px;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="site-header">
    <div class="header-logo-target" id="logoTarget"></div>
    <ul class="nav-list">
      <li>ABOUT</li>
      <li>PRODUCTS</li>
      <li>CONTACT</li>
    </ul>
  </header>

  <!-- 画面固定スクロールエリア -->
  <section class="hero-section" id="hero">
    <div class="hero-text" id="heroText">Scroll Down</div>
  </section>

  <!-- スクロール演出用のロゴ（fixedで画面に配置） -->
  <svg viewBox="0 0 200 200" class="animated-logo" id="animatedLogo">
    <!-- 丸（グレー） -->
    <path class="mark-grey" id="circlePart" d="M100,152.4c-28.9,0-52.4-23.4-52.4-52.4S71.1,47.6,100,47.6c25.5,0,46.7,18.2,51.4,42.3h48.1 C194.4,39.4,151.8,0,100,0C44.8,0,0,44.8,0,100s44.8,100,100,100c25.3,0,48.3-9.4,65.9-24.8l-33.8-33.8 C123.2,148.2,112.1,152.4,100,152.4"/>
    <!-- 三角（オレンジ） -->
    <polygon class="mark-orange" id="trianglePart" points="200,105.3 200,187.3 118,105.3"/>
  </svg>

  <!-- メインコンテンツ -->
  <section class="content-section">
    <h2>Main Content Area</h2>
    <p>スクロールを下に下げ切っても、ロゴがヘッダー位置に固定されて消えません。</p>
  </section>

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
   gsap.registerPlugin(ScrollTrigger);

const logo = document.getElementById('animatedLogo');
const target = document.getElementById('logoTarget');

function getTargetOffset() {
  const targetRect = target.getBoundingClientRect();
  const logoRect = logo.getBoundingClientRect();

  return {
    x: targetRect.left - logoRect.left,
    y: targetRect.top - logoRect.top,
    scale: targetRect.width / logoRect.width
  };
}

// 画面幅に応じた切り替えの設定
ScrollTrigger.matchMedia({

  // 1. PC用の設定（769px以上）
  "(min-width: 769px)": function() {
    // 初期位置：ダイナミックに大きく分散
    gsap.set('#circlePart', { x: -180, y: -120, rotation: -90, opacity: 0, transformOrigin: 'center center' });
    gsap.set('#trianglePart', { x: 180, y: 120, rotation: 90, opacity: 0, transformOrigin: 'center center' });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: '+=1500', // PCはしっかりスクロールさせて見せる
        scrub: 1,
        pin: true,
        anticipatePin: 1
      }
    });

    tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1.5, ease: 'power2.out' })
      .to('#heroText', { opacity: 0, duration: 0.5 }, '<')
      .to(logo, {
        x: () => getTargetOffset().x,
        y: () => getTargetOffset().y,
        scale: () => getTargetOffset().scale,
        transformOrigin: 'top left',
        duration: 1.5,
        ease: 'power2.inOut'
      });
  },

  // 2. スマホ用の設定（768px以下）
  "(max-width: 768px)": function() {
    // 初期位置：画面からはみ出さないよう控えめに分散
    gsap.set('#circlePart', { x: -80, y: -60, rotation: -45, opacity: 0, transformOrigin: 'center center' });
    gsap.set('#trianglePart', { x: 80, y: 60, rotation: 45, opacity: 0, transformOrigin: 'center center' });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: '+=800', // スマホはスクロール量を短くしてサクサク動かす
        scrub: 0.5,
        pin: true,
        anticipatePin: 1
      }
    });

    tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1, ease: 'power2.out' })
      .to('#heroText', { opacity: 0, duration: 0.3 }, '<')
      .to(logo, {
        x: () => getTargetOffset().x,
        y: () => getTargetOffset().y,
        scale: () => getTargetOffset().scale,
        transformOrigin: 'top left',
        duration: 1,
        ease: 'power2.inOut'
      });
  }

});

    // 画面サイズ変更時に位置を再計算
    window.addEventListener('resize', () => ScrollTrigger.refresh());
  </script>
</body>
</html>
