<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Logo Scroll Animation</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: sans-serif;
      color: #333;
      overflow-x: hidden;
    }

    /* 固定ヘッダー */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #eee;
    }

    /* ヘッダー左上のターゲット枠 */
    .header-logo-target {
      width: 40px;
      height: 40px;
    }

    /* ヘッダー中央のターゲット（GLANZ SVG用） */
    .header-title-target {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0; /* 最初は非表示 */
    }

    .header-title-target svg {
      width: 100%;
      height: auto;
      fill: #333;
    }

    .nav-list {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-weight: bold;
      font-size: 14px;
    }

    /* 画面固定スクロールエリア */
    .hero-section {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    /* 中央のGLANZ SVGテキスト */
    .hero-glanz-svg {
      position: absolute;
      top: calc(50% + 80px); /* Gマークの直下に配置 */
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: auto;
      z-index: 10;
    }

    .hero-glanz-svg svg {
      width: 100%;
      height: auto;
      fill: #333;
    }

    /* アニメーションSVG（初期位置はGSAPで制御） */
    .animated-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 180px;
      overflow: visible;
      z-index: 2000;
      pointer-events: none;
    }

    .mark-grey { fill: #9DA5A9; }
    .mark-orange { fill: #FF5500; }

    /* 下部コンテンツ */
    .content-section {
      min-height: 150vh;
      background: #ffffff;
      padding: 100px 24px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .animated-logo {
        width: 140px;
        height: 140px;
      }
      .hero-glanz-svg {
        top: calc(50% + 65px);
        width: 140px;
      }
      .header-logo-target {
        width: 32px;
        height: 32px;
      }
      .nav-list {
        gap: 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="site-header">
    <div class="header-logo-target" id="logoTarget"></div>
    <div class="header-title-target" id="headerTitleTarget">
      <!-- 指定のGLANZ SVG（ヘッダー用） -->
      <svg id="_レイヤー_1" data-name=" レイヤー 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146.45 29.98">

        <polygon class="cls-1" points="33.15 1.43 37.3 1.43 37.3 25.71 50.67 25.71 50.67 29.75 33.15 29.75 33.15 1.43"/>

      </svg>
    </div>
    <ul class="nav-list">
      <li>ABOUT</li>
      <li>PRODUCTS</li>
      <li>CONTACT</li>
    </ul>
  </header>

  <!-- 画面固定スクロールエリア -->
  <section class="hero-section" id="hero">
    <div class="hero-glanz-svg" id="heroGlanzText">
      <!-- 指定のGLANZ SVG（メイン用） -->
      <svg id="_レイヤー_1" data-name=" レイヤー 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146.45 29.98">
        <defs><style>.cls-1 { stroke-width: 0px; }</style></defs>
        <path class="cls-1" d="m9.83,14.17h9.75v5.76c-.05,2.83-.99,5.21-2.82,7.12-1.84,1.9-4.16,2.88-6.96,2.93-2.16-.05-3.95-.6-5.4-1.63-1.47-1-2.53-2.15-3.2-3.46-.2-.43-.38-.83-.54-1.22-.15-.4-.28-.91-.38-1.51-.19-1.14-.28-3.33-.28-6.57s.09-5.49.28-6.6c.2-1.11.51-2.01.92-2.7.67-1.31,1.73-2.47,3.2-3.5,1.44-1.04,3.24-1.57,5.4-1.59,2.65.03,4.8.83,6.47,2.43,1.67,1.61,2.72,3.59,3.16,5.96h-4.41c-.34-1.14-.95-2.12-1.85-2.93-.93-.77-2.06-1.16-3.39-1.19-.98.03-1.82.23-2.52.6-.72.39-1.29.88-1.73,1.46-.54.61-.9,1.4-1.07,2.36-.2,1.01-.3,2.91-.3,5.7s.1,4.68.3,5.66c.18.99.53,1.79,1.07,2.4.44.58,1.02,1.06,1.73,1.42.7.43,1.54.64,2.52.64,1.62,0,2.96-.57,4.01-1.71,1.05-1.09,1.6-2.53,1.62-4.31v-1.48h-5.6v-4.04h.02Z"/>
        <polygon class="cls-1" points="33.15 1.43 37.3 1.43 37.3 25.71 50.67 25.71 50.67 29.75 33.15 29.75 33.15 1.43"/>
        <polygon class="cls-1" points="96.03 1.43 99.95 1.43 112.37 21.56 112.44 21.56 112.44 1.43 116.6 1.43 116.6 29.75 112.66 29.75 100.26 9.62 100.18 9.62 100.18 29.75 96.03 29.75 96.03 1.43"/>
        <polygon class="cls-1" points="128.93 26.19 141.37 5.24 129.04 5.24 129.04 1.43 146.45 1.43 146.45 4.66 133.57 25.71 146.45 25.71 146.45 29.75 128.93 29.75 128.93 26.19"/>
        <polygon class="cls-1" points="73.18 0 60.09 29.75 64.57 29.75 73.17 9.89 81.69 29.75 86.17 29.75 73.18 0"/>
      </svg>
    </div>
  </section>

  <!-- スクロール演出用のロゴ -->
  <svg viewBox="0 0 200 200" class="animated-logo" id="animatedLogo">
    <path class="mark-grey" id="circlePart" d="M100,152.4c-28.9,0-52.4-23.4-52.4-52.4S71.1,47.6,100,47.6c25.5,0,46.7,18.2,51.4,42.3h48.1 C194.4,39.4,151.8,0,100,0C44.8,0,0,44.8,0,100s44.8,100,100,100c25.3,0,48.3-9.4,65.9-24.8l-33.8-33.8 C123.2,148.2,112.1,152.4,100,152.4"/>
    <polygon class="mark-orange" id="trianglePart" points="200,105.3 200,187.3 118,105.3"/>
  </svg>

  <!-- メインコンテンツ -->
  <section class="content-section">
    <h2>Main Content Area</h2>
  </section>

  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

const logo = document.getElementById('animatedLogo');
const target = document.getElementById('logoTarget');

// 目的地の正確な座標と縮小率を計算
function getTargetOffset() {
  const targetRect = target.getBoundingClientRect();
  const logoRect = logo.getBoundingClientRect();

  return {
    x: targetRect.left - logoRect.left,
    y: targetRect.top - logoRect.top,
    scale: targetRect.width / logoRect.width
  };
}

ScrollTrigger.matchMedia({

  // ----------------------------------------
  // 1. PC用の設定（769px以上）
  // ----------------------------------------
  "(min-width: 769px)": function() {
    gsap.set(logo, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, transformOrigin: 'center center' });
    gsap.set('#circlePart', { x: -180, y: -120, rotation: -90, opacity: 0, transformOrigin: 'center center' });
    gsap.set('#trianglePart', { x: 180, y: 120, rotation: 90, opacity: 0, transformOrigin: 'center center' });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: '+=1000',
        scrub: 1,
        pin: true,
        invalidateOnRefresh: true
      }
    });

    // STEP 1: ロゴ合体 & GLANZ SVG消去
    tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1.5, ease: 'power2.out' })
      .to('#heroGlanzText', { opacity: 0, duration: 0.8 }, '<');

    // STEP 2: 基準点を「左上」に変更してヘッダー枠へぴったり移動
    tl.to(logo, {
      x: () => getTargetOffset().x,
      y: () => getTargetOffset().y,
      scale: () => getTargetOffset().scale,
      transformOrigin: 'left top', // ★コレでズレが解消されます！
      duration: 1.5,
      ease: 'power2.inOut'
    })
    .to('#headerTitleTarget', { opacity: 1, duration: 1 }, '-=0.8');
  },

  // ----------------------------------------
  // 2. スマホ用の設定（768px以下）
  // ----------------------------------------
  "(max-width: 768px)": function() {
    gsap.set(logo, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, transformOrigin: 'center center' });
    gsap.set('#circlePart', { x: -70, y: -40, rotation: -45, opacity: 0, transformOrigin: 'center center' });
    gsap.set('#trianglePart', { x: 70, y: 40, rotation: 45, opacity: 0, transformOrigin: 'center center' });
    gsap.set('#headerTitleTarget', { opacity: 0 });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: '+=350', // ★スクロール量を超ショート（サクサク）に短縮！
        scrub: 0.3,   // 追従レスポンスを素早く
        pin: true,
        invalidateOnRefresh: true
      }
    });

    // STEP 1: 合体 & 文字消去
    tl.to(['#circlePart', '#trianglePart'], { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1, ease: 'power2.out' })
      .to('#heroGlanzText', { opacity: 0, duration: 0.5 }, '<');

    // STEP 2: 基準点を「左上」に変更してヘッダー枠へぴったり移動
    tl.to(logo, {
      x: () => getTargetOffset().x,
      y: () => getTargetOffset().y,
      scale: () => getTargetOffset().scale,
      transformOrigin: 'left top', // ★コレでズレが解消されます！
      duration: 1,
      ease: 'power2.inOut'
    });
  }

});

// 画面サイズ変更時・画面回転時の再設定
window.addEventListener('resize', () => ScrollTrigger.refresh());
  </script>
</body>
</html>
